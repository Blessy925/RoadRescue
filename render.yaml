services:
  - type: web
    name: roadrescue
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health




    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.20.0










      - key: HOSPITAL_ADMIN_TOKEN
        generateValue: true
